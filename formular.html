<!DOCTYPE html>
<html lang="sk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Formulár | Pomoc zvieratám</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body class="d-flex flex-column min-vh-100">
    <header>
        <nav class="navbar navbar-expand-lg bg-white shadow-sm">
            <div class="container">
                <a class="navbar-brand fw-bold text-primary" href="index.html">Pomoc zvieratám</a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNavbar" aria-controls="mainNavbar" aria-expanded="false" aria-label="Otvoriť navigáciu">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="mainNavbar">
                    <ul class="navbar-nav ms-auto mb-2 mb-lg-0">
                        <li class="nav-item"><a class="nav-link" href="index.html">Domov</a></li>
                        <li class="nav-item"><a class="nav-link" href="galeria.html">Galéria</a></li>
                        <li class="nav-item"><a class="nav-link" href="kontakt.html">Kontakt</a></li>
                        <li class="nav-item"><a class="nav-link active" href="formular.html" aria-current="page">Formulár</a></li>
                        <li class="nav-item"><a class="nav-link" href="zamestnanci.html">Prehľad</a></li>
                    </ul>
                </div>
            </div>
        </nav>
    </header>

    <main class="flex-grow-1">
        <section class="container py-5">
            <div class="card shadow-sm mx-auto form-card">
                <div class="card-body p-4 p-md-5">
                    <h1 class="h2 text-center text-primary mb-4">Registrácia zákazníka</h1>
                    <form>
                        <div class="mb-3">
                            <label for="meno" class="form-label">Meno</label>
                            <input type="text" class="form-control" id="meno" name="meno" placeholder="Zadajte svoje meno" required>
                        </div>
                        <div class="mb-3">
                            <label for="email" class="form-label">Email</label>
                            <input type="email" class="form-control" id="email" name="email" placeholder="vas@email.com" required>
                        </div>
                        <div class="mb-3">
                            <label for="vek" class="form-label">Vek</label>
                            <input type="number" class="form-control" id="vek" name="vek" min="1" max="120" required>
                        </div>
                        <div class="mb-3">
                            <label for="heslo" class="form-label">Heslo</label>
                            <input type="password" class="form-control" id="heslo" name="heslo" required>
                        </div>
                        <div class="mb-4">
                            <label for="datum" class="form-label">Dátum vyplnenia</label>
                            <input type="date" class="form-control" id="datum" name="datum" required>
                        </div>
                        <button type="submit" class="btn btn-primary w-100">Odoslať</button>
                    </form>
                </div>
            </div>
        </section>
    </main>

    <footer class="border-top bg-white text-center text-secondary py-3 mt-auto">
        <div class="container"><p class="mb-0">&copy; 2026 Všetky práva vyhradené.</p></div>
    </footer>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
